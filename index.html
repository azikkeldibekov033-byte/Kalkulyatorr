<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kalkulyator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4c1d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalkulyator">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7e22ce 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }

  .calculator {
    width: 100%;
    max-width: 340px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 28px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .display {
    background: rgba(0, 0, 0, 0.25);
    border-radius: 18px;
    padding: 24px 20px;
    margin-bottom: 18px;
    text-align: right;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .prev-operand {
    color: rgba(255, 255, 255, 0.5);
    font-size: 15px;
    min-height: 20px;
    word-break: break-all;
  }

  .current-operand {
    color: #ffffff;
    font-size: 40px;
    font-weight: 600;
    word-break: break-all;
    line-height: 1.1;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: none;
    outline: none;
    border-radius: 16px;
    font-size: 20px;
    font-weight: 500;
    padding: 18px 0;
    cursor: pointer;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    transition: transform 0.08s ease, background 0.15s ease;
  }

  button:active {
    transform: scale(0.94);
  }

  button:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  .operator {
    background: rgba(249, 115, 22, 0.85);
  }

  .operator:hover {
    background: rgba(249, 115, 22, 1);
  }

  .equals {
    background: rgba(34, 197, 94, 0.9);
    grid-column: span 2;
  }

  .equals:hover {
    background: rgba(34, 197, 94, 1);
  }

  .clear, .delete {
    background: rgba(239, 68, 68, 0.75);
  }

  .clear:hover, .delete:hover {
    background: rgba(239, 68, 68, 0.95);
  }

  .zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="prev-operand" id="prev-operand"></div>
    <div class="current-operand" id="current-operand">0</div>
  </div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button class="delete" onclick="deleteDigit()">DEL</button>
    <button class="operator" onclick="chooseOperator('%')">%</button>
    <button class="operator" onclick="chooseOperator('÷')">÷</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="chooseOperator('×')">×</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="chooseOperator('-')">-</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="chooseOperator('+')">+</button>

    <button class="zero" onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button class="equals" onclick="compute()">=</button>
  </div>
</div>

<script>
  let currentOperand = '0';
  let prevOperand = '';
  let operation = undefined;

  const currentOperandEl = document.getElementById('current-operand');
  const prevOperandEl = document.getElementById('prev-operand');

  function updateDisplay() {
    currentOperandEl.textContent = formatNumber(currentOperand);
    if (operation != null) {
      prevOperandEl.textContent = `${formatNumber(prevOperand)} ${operation}`;
    } else {
      prevOperandEl.textContent = '';
    }
  }

  function formatNumber(numStr) {
    if (numStr === '') return '';
    const stringNumber = numStr.toString();
    const integerDigits = parseFloat(stringNumber.split('.')[0]);
    const decimalDigits = stringNumber.split('.')[1];
    let integerDisplay;
    if (isNaN(integerDigits)) {
      integerDisplay = '0';
    } else {
      integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
    }
    if (decimalDigits != null) {
      return `${integerDisplay}.${decimalDigits}`;
    } else {
      return integerDisplay;
    }
  }

  function appendNumber(number) {
    if (number === '.' && currentOperand.includes('.')) return;
    if (currentOperand === '0' && number !== '.') {
      currentOperand = number;
    } else {
      currentOperand += number;
    }
    updateDisplay();
  }

  function chooseOperator(op) {
    if (currentOperand === '' ) return;
    if (prevOperand !== '') {
      compute();
    }
    operation = op;
    prevOperand = currentOperand;
    currentOperand = '';
    updateDisplay();
  }

  function compute() {
    let result;
    const prev = parseFloat(prevOperand);
    const current = parseFloat(currentOperand);
    if (isNaN(prev) || isNaN(current)) return;

    switch (operation) {
      case '+':
        result = prev + current;
        break;
      case '-':
        result = prev - current;
        break;
      case '×':
        result = prev * current;
        break;
      case '÷':
        result = current === 0 ? 'Xato' : prev / current;
        break;
      case '%':
        result = prev % current;
        break;
      default:
        return;
    }

    currentOperand = typeof result === 'number' ? roundResult(result).toString() : result;
    operation = undefined;
    prevOperand = '';
    updateDisplay();
  }

  function roundResult(num) {
    return Math.round(num * 1e10) / 1e10;
  }

  function deleteDigit() {
    if (currentOperand === '') return;
    currentOperand = currentOperand.toString().slice(0, -1);
    if (currentOperand === '') currentOperand = '0';
    updateDisplay();
  }

  function clearAll() {
    currentOperand = '0';
    prevOperand = '';
    operation = undefined;
    updateDisplay();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    if (e.key === '.') appendNumber('.');
    if (e.key === '+') chooseOperator('+');
    if (e.key === '-') chooseOperator('-');
    if (e.key === '*') chooseOperator('×');
    if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
    if (e.key === 'Enter' || e.key === '=') compute();
    if (e.key === 'Backspace') deleteDigit();
    if (e.key === 'Escape') clearAll();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => console.log('SW ro\'yxatga olinmadi:', err));
    });
  }
</script>

</body>
</html>
